<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motynth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span id="logo"></span><h1 class="name">Motynth</h1></div>
  <div class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-compose" aria-selected="true" aria-controls="view-compose">Compose</button>
    <button class="tab" role="tab" id="tab-sounds" aria-selected="false" aria-controls="view-sounds">Sounds</button>
    <button class="tab" role="tab" id="tab-learn" aria-selected="false" aria-controls="view-learn">Learn</button>
  </div>
  <div class="transport">
    <label><input type="checkbox" id="loop"> Loop</label>
    <canvas id="scope" width="48" height="16" aria-hidden="true"></canvas>
    <button class="btn" id="playbtn" aria-pressed="false"></button>
  </div>
</header>
<main>
  <section id="view-compose" class="compose" role="tabpanel" aria-labelledby="tab-compose">
    <div>
      <div class="bar">
        <select id="examples" aria-label="Load an example"><option value="">Load an example…</option></select>
        <button class="btn small" id="restore" hidden>Restore previous text</button>
        <span class="grow"></span>
        <span class="hint">Ctrl+Enter plays</span>
      </div>
      <div class="editor">
        <div class="gutter" aria-hidden="true"><div id="gutIn"></div></div>
        <div class="edwrap">
          <div class="hl" aria-hidden="true"><div class="hl-in" id="hlIn"></div></div>
          <textarea class="code" id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="Composition code"></textarea>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <div class="panel">
      <h2>Score</h2>
      <div class="roll-wrap">
        <canvas id="roll" aria-label="Piano roll of the composition"></canvas>
        <div id="playhead"></div>
        <div class="roll-empty" id="rollEmpty">Your notes appear here once the code can play.</div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="stats" id="stats"></div>
      <p class="hint" style="margin-top:14px">New here? The Learn tab has six short lessons, each with snippets you can play.</p>
    </div>
  </section>

  <section id="view-sounds" role="tabpanel" aria-labelledby="tab-sounds" hidden>
    <div class="panel testbar">
      <button class="btn primary" id="testPlay"></button>
      <input type="text" id="testMotif" spellcheck="false" aria-label="Test motif">
      <select id="testPreset" aria-label="Test motif presets"></select>
      <label>Octave <input type="number" class="oct" id="testOct" value="0" min="-3" max="3" step="1"></label>
      <label><input type="checkbox" id="testAuto" checked> Play after each change</label>
      <span class="warn" id="testMsg" role="alert"></span>
    </div>
    <div class="sounds">
      <div class="panel" id="lists"></div>
      <div class="panel" id="instEd"></div>
      <div class="panel wave-col" id="waveEd"></div>
    </div>
  </section>

  <section id="view-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
    <div class="learn">
      <nav class="panel lessons" id="lessonNav" aria-label="Lessons"></nav>
      <article id="lesson" class="lesson"></article>
    </div>
  </section>
</main>
<script>
'use strict';
/* =====================  exact fractions  ===================== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;};
const F=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d);return{n:n/g,d:d/g};};
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d);
const fsub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d);
const fmul=(a,b)=>F(a.n*b.n,a.d*b.d);
const fdiv=(a,b)=>F(a.n*b.d,a.d*b.n);
const fcmp=(a,b)=>a.n*b.d-b.n*a.d;
const fnum=a=>a.n/a.d;
const F0=F(0),F1=F(1);
function fparse(s){const m=/^(\d+)(?:\.(\d+))?$/.exec(s);if(!m)return null;const dec=m[2]||'';return F(parseInt(m[1]+dec,10),Math.pow(10,dec.length));}

/* =====================  language constants  ===================== */
const UNIT={w:F(1),h:F(1,2),q:F(1,4),e:F(1,8),s:F(1,16),t:F(1,32)};
const RESERVED=new Set(['tuning','register','names','mode','tempo','root','motif','play','with','section','staff','length','rest','of']);
const BUILTIN_MODES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],phrygian:[0,1,3,5,7,8,10],lydian:[0,2,4,6,7,9,11],mixolydian:[0,2,4,5,7,9,10],locrian:[0,1,3,5,6,8,10],'harmonic-minor':[0,2,3,5,7,8,11],pentatonic:[0,2,4,7,9],'minor-pentatonic':[0,3,5,7,10],blues:[0,3,5,6,7,10],'whole-tone':[0,2,4,6,8,10],chromatic:null};
const EVENT_LIMIT=40000, SECONDS_LIMIT=1800;

class MotError extends Error{constructor(msg,pos){super(msg);this.pos=pos;}}

/* =====================  parser (scannerless)  ===================== */
function parseProgram(src){
  let i=0;const L=src.length;
  const err=(m,p)=>{throw new MotError(m,p===undefined?i:p);};
  const IDENT=/[A-Za-z_][A-Za-z0-9_]*(?:-[A-Za-z][A-Za-z0-9_]*)*/y;
  const NUM=/\d+(?:\.\d+)?/y;
  const INT=/\d+/y;
  const isDigit=c=>c!==undefined&&c>='0'&&c<='9';
  const isWordChar=c=>c!==undefined&&/[A-Za-z0-9_]/.test(c);
  function skipInline(){for(;;){const c=src[i];if(c===' '||c==='\t'||c==='\r')i++;else if(c==='/'&&src[i+1]==='/'){while(i<L&&src[i]!=='\n')i++;}else break;}}
  function skipWS(){for(;;){skipInline();if(src[i]==='\n')i++;else break;}}
  function peekIdent(){IDENT.lastIndex=i;const m=IDENT.exec(src);return m?m[0]:null;}
  function ident(what){const w=peekIdent();if(!w)err('Expected '+(what||'a name'));i+=w.length;return w;}
  function found(){return i>=L?'the end':(src[i]==='\n'?'the end of the line':'"'+src[i]+'"');}
  function expect(ch,ctx){skipInline();if(src[i]!==ch)err('Expected "'+ch+'"'+(ctx?' '+ctx:'')+', found '+found());i++;}
  function number(what){skipInline();NUM.lastIndex=i;const m=NUM.exec(src);if(!m)err('Expected a number'+(what?' for '+what:'')+', found '+found());i+=m[0].length;return m[0];}
  function signedInt(){let neg=false;if(src[i]==='-'){neg=true;i++;}else if(src[i]==='+')i++;INT.lastIndex=i;const r=INT.exec(src);if(!r)err('Expected a whole number');i+=r[0].length;const v=parseInt(r[0],10);return neg?-v:v;}
  function intList(){skipInline();if(src[i]!=='[')err('Expected "[" to start a list of note numbers');i++;const out=[];for(;;){skipWS();while(src[i]===','){i++;skipWS();}if(src[i]===']'){i++;break;}if(i>=L)err('Missing "]"');INT.lastIndex=i;const r=INT.exec(src);if(!r)err('Expected a whole number, found '+found());i+=r[0].length;out.push(parseInt(r[0],10));}return out;}

  function parseDur(spaced){
    let v;
    if(isDigit(src[i])){
      NUM.lastIndex=i;const m=NUM.exec(src);i+=m[0].length;let a=fparse(m[0]);
      if(src[i]==='/'&&isDigit(src[i+1])){i++;INT.lastIndex=i;const r=INT.exec(src);i+=r[0].length;v=fdiv(a,F(parseInt(r[0],10)));}
      else{
        let u=null;
        if(spaced){const save=i;skipInline();const w=peekIdent();if(w&&UNIT[w]){i+=w.length;u=w;}else i=save;}
        else if(UNIT[src[i]]&&!isWordChar(src[i+1])){u=src[i];i++;}
        v=u?fmul(a,UNIT[u]):a;
      }
    }else{
      const u=src[i];
      if(!u||!UNIT[u]||isWordChar(src[i+1]))err('Expected a duration such as q, e, h or 1/8, found '+found());
      i++;v=UNIT[u];
    }
    let add=v;while(src[i]==='.'){i++;add=fdiv(add,F(2));v=fadd(v,add);}
    if(src[i]==='*'){i++;NUM.lastIndex=i;const m=NUM.exec(src);if(!m)err('Expected a number after *');i+=m[0].length;let k=fparse(m[0]);if(src[i]==='/'&&isDigit(src[i+1])){i++;INT.lastIndex=i;const r=INT.exec(src);i+=r[0].length;k=fdiv(k,F(parseInt(r[0],10)));}v=fmul(v,k);}
    if(v.n<=0)err('A duration must be longer than zero');
    return v;
  }

  const PITCH=/^(n?)(-?\d+)([#b]*)(?:\^(-?\d+))?$/;
  const NAMEW=/^([A-Za-z][A-Za-z0-9#_-]*)(?:\^(-?\d+))?$/;
  function pitchFromWord(w,pos){
    let m=PITCH.exec(w);
    if(m){const alt=(m[3].match(/#/g)||[]).length-(m[3].match(/b/g)||[]).length;return{type:'pitch',kind:m[1]?'note':'deg',v:parseInt(m[2],10),alt,reg:m[4]?parseInt(m[4],10):0,pos};}
    m=NAMEW.exec(w);
    if(m)return{type:'word',name:m[1],reg:m[2]?parseInt(m[2],10):0,pos};
    err('Can\u2019t read "'+w+'" as a note',pos);
  }
  const WORD=/[^\s\[\]\(\):,]+/y;
  function readWord(){WORD.lastIndex=i;const m=WORD.exec(src);if(!m)err('Unexpected '+found()+' in motif');i+=m[0].length;return m[0];}
  function motif(pos){
    const items=[];
    for(;;){
      skipWS();while(src[i]===','){i++;skipWS();}
      if(src[i]===']'){i++;break;}
      if(i>=L)err('This motif is missing its closing "]"',pos);
      const p=i;let item;
      if(src[i]==='('){
        i++;const ps=[];
        for(;;){skipWS();if(src[i]===')'){i++;break;}if(i>=L)err('Missing ")" after chord',p);const q=i;ps.push(pitchFromWord(readWord(),q));}
        if(!ps.length)err('Empty chord',p);
        item={type:'chord',pitches:ps,pos:p};
      }else{
        const w=readWord();
        if(w==='.'||w==='rest'||w==='r')item={type:'rest',pos:p};
        else if(w==='_')item={type:'tie',pos:p};
        else if(w==='x')item={type:'hit',pos:p};
        else item=pitchFromWord(w,p);
      }
      skipInline();
      if(src[i]===':'){i++;skipInline();item.dur=parseDur(false);}
      items.push(item);
    }
    return{type:'motif',items,pos};
  }

  function setting(){
    const pos=i;const kind=ident('a setting');
    if(kind==='tuning'){const n=parseInt(number('the number of notes'),10);if(n<1||n>128)err('A tuning needs between 1 and 128 notes',pos);let ratio=null;skipInline();if(peekIdent()==='of'){i+=2;ratio=parseFloat(number('the register ratio'));}return{kind,n,ratio,pos};}
    if(kind==='register'){const r=parseFloat(number('the register ratio'));return{kind,ratio:r,pos};}
    if(kind==='names'){skipInline();if(src[i]!=='[')err('Expected "[" after names');i++;const out=[];for(;;){skipWS();while(src[i]===','){i++;skipWS();}if(src[i]===']'){i++;break;}if(i>=L)err('Missing "]"');const w=readWord();out.push(w);}return{kind,names:out,pos};}
    if(kind==='mode'){skipInline();if(src[i]==='[')return{kind,arr:intList(),pos};return{kind,name:ident('a mode name'),pos};}
    if(kind==='tempo'){const t=fparse(number('the tempo'));if(t.n<=0)err('Tempo must be above zero',pos);return{kind,value:t,pos};}
    if(kind==='root'){const r=parseFloat(number('the root frequency in Hz'));if(!(r>0))err('Root must be above zero',pos);return{kind,hz:r,pos};}
    err('Unknown setting "'+kind+'". Use tuning, register, names, mode, tempo or root',pos);
  }

  function modifiers(){
    const mods=[];
    for(;;){
      skipInline();const c=src[i],pos=i;
      if((c==='+'||c==='-')&&isDigit(src[i+1])){mods.push({t:'deg',v:signedInt(),pos});continue;}
      if(c==='~'){i++;mods.push({t:'note',v:signedInt(),pos});continue;}
      if(c==='^'){i++;mods.push({t:'reg',v:signedInt(),pos});continue;}
      if(c==='*'&&isDigit(src[i+1])){i++;const f=fparse(number());mods.push({t:'scale',f:fdiv(F1,f),pos});continue;}
      if(c==='/'&&src[i+1]!=='/'){i++;const f=fparse(number());if(f.n===0)err('Can\u2019t divide by zero',pos);mods.push({t:'scale',f,pos});continue;}
      const w=peekIdent();
      if(w==='rev'||w==='inv'||w==='fit'||w==='loop'||w==='sets-length'){i+=w.length;mods.push({t:w,pos});continue;}
      if(w&&/^x\d+$/.test(w)){i+=w.length;const n=parseInt(w.slice(1),10);if(n<1)err('Repeat at least once',pos);mods.push({t:'rep',n,pos});continue;}
      break;
    }
    return mods;
  }

  function term(){skipInline();const pos=i;const base=primary();const mods=modifiers();return{type:'term',base,mods,pos};}

  function primary(){
    skipInline();const pos=i;const c=src[i];
    if(c==='['){i++;return motif(pos);}
    if(c==='('){i++;const s=seq(true,')');expect(')');return s;}
    const w=peekIdent();
    if(!w)err(i>=L?'Expected a motif, a name or a block, but the line ended':'Unexpected "'+src[i]+'" \u2014 expected a motif, a name or a block');
    if(w==='section'||w==='staff'){i+=w.length;expect('{','after '+w);const items=staffBody();expect('}');return{type:'staff',kind:w,items,pos};}
    if(w==='with'){
      i+=4;const settings=[];
      for(;;){skipInline();settings.push(setting());skipInline();if(src[i]===','){i++;continue;}if(src[i]==='{')break;if(peekIdent())continue;err('Expected "," or "{" after the setting, found '+found());}
      expect('{');const body=seq(true,'}');expect('}','to close the with block');
      return{type:'with',settings,body,pos};
    }
    if(w==='rest'){i+=4;skipInline();return{type:'rest',dur:parseDur(true),pos};}
    i+=w.length;skipInline();
    if(src[i]===':'&&src[i+1]!==':'){i++;const t=term();return{type:'inst',name:w,term:t,pos};}
    return{type:'ref',name:w,pos};
  }

  function seq(nl,close){
    const items=[];const pos=i;
    for(;;){
      if(nl)skipWS();else skipInline();
      if(nl&&src[i]===close)break;
      if(i>=L){if(nl)err('Missing "'+close+'"',pos);break;}
      items.push(term());
      skipInline();
      if(src[i]===','){i++;skipWS();continue;}
      if(nl){if(src[i]==='\n'||src[i]===close)continue;err('Unexpected '+found()+' \u2014 separate items with commas or new lines');}
      break;
    }
    if(!nl&&!items.length)err('Expected something to play, found '+found());
    return{type:'seq',items,pos};
  }

  function staffBody(){
    const items=[];
    for(;;){
      skipWS();while(src[i]===','){i++;skipWS();}
      if(src[i]==='}')break;
      if(i>=L)err('Missing "}"');
      if(peekIdent()==='length'){const pos=i;i+=6;skipInline();items.push({type:'length',dur:parseDur(true),pos});}
      else items.push(term());
      skipInline();
      if(i<L&&src[i]!=='\n'&&src[i]!==','&&src[i]!=='}')err('Unexpected '+found()+' \u2014 put each block on its own line');
    }
    return items;
  }

  function statement(){
    const pos=i;const w=peekIdent();
    const defName=(n,p)=>{if(RESERVED.has(n))err('"'+n+'" is a keyword and can\u2019t be used as a name',p);return n;};
    if(w==='motif'){i+=5;skipInline();const np=i;const name=defName(ident('a motif name'),np);expect('=','after the motif name');skipInline();return{type:'def',name,expr:seq(false,null),pos};}
    if(w==='mode'){
      const save=i;i+=4;skipInline();const nm=peekIdent();
      if(nm){i+=nm.length;skipInline();if(src[i]==='='&&src[i+1]!=='='){i++;return{type:'modedef',name:nm,arr:intList(),pos};}}
      i=save;return{type:'setting',s:setting(),pos};
    }
    if(w==='tuning'||w==='register'||w==='names'||w==='tempo'||w==='root')return{type:'setting',s:setting(),pos};
    if(w==='play'){i+=4;skipInline();return{type:'expr',expr:seq(false,null),pos};}
    if(w){
      const save=i;i+=w.length;skipInline();
      if(src[i]==='='&&src[i+1]!=='='){defName(w,pos);i++;skipInline();return{type:'def',name:w,expr:seq(false,null),pos};}
      i=save;
    }
    return{type:'expr',expr:seq(false,null),pos};
  }

  const stmts=[];
  skipWS();
  while(i<L){
    stmts.push(statement());
    skipInline();
    if(i<L&&src[i]!=='\n')err('Unexpected '+found()+' \u2014 separate items with commas, or start a new line');
    skipWS();
  }
  return stmts;
}

/* =====================  pitch math  ===================== */
const mod=(a,b)=>((a%b)+b)%b;
function degToNote(a,mode,N){const M=mode.length;const q=Math.floor(a/M);return mode[a-q*M]+q*N;}
function noteToDeg(n,mode,N){
  const M=mode.length;let q=Math.floor(n/N);const r=n-q*N;let k=-1;
  for(let j=0;j<M;j++)if(mode[j]<=r)k=j;
  if(k<0){q-=1;k=M-1;return{d:q*M+k,res:r+N-mode[k]};}
  return{d:q*M+k,res:r-mode[k]};
}
function modeArr(S){if(S.mode)return S.mode;const a=[];for(let k=0;k<S.N;k++)a.push(k);return a;}
function resolvePitch(S,p){
  const mode=modeArr(S),N=S.N;let n;
  if(p.kind==='deg'){n=degToNote(p.v-1+S.shift.deg,mode,N)+p.alt;}
  else{n=p.v+p.alt;if(S.shift.deg){const x=noteToDeg(n,mode,N);n=degToNote(x.d+S.shift.deg,mode,N)+x.res;}}
  return n+(p.reg+S.shift.reg)*N+S.shift.note;
}
const freqOf=e=>e.root*Math.pow(e.ratio,e.n/e.N);

/* =====================  compile / evaluate  ===================== */
function lineCol(src,pos){let line=1,col=1;for(let k=0;k<pos&&k<src.length;k++){if(src[k]==='\n'){line++;col=1;}else col++;}return{line,col};}
function rootScope(){return{N:12,ratio:2,mode:BUILTIN_MODES.major,names:null,root:261.6256,tempo:F(120),shift:{deg:0,note:0,reg:0}};}

function applySetting(S,s,env){
  const S2={...S};
  if(s.kind==='tuning'){
    if(s.n!==S.N){S2.mode=null;S2.names=null;}
    S2.N=s.n;if(s.ratio!==null){if(!(s.ratio>0)||s.ratio===1)throw new MotError('The register ratio must be above 0 and not 1',s.pos);S2.ratio=s.ratio;}
  }else if(s.kind==='register'){
    if(!(s.ratio>0)||s.ratio===1)throw new MotError('The register ratio must be above 0 and not 1',s.pos);S2.ratio=s.ratio;
  }else if(s.kind==='names'){
    if(s.names.length!==S.N)throw new MotError('This tuning has '+S.N+' notes, so names needs '+S.N+' entries (got '+s.names.length+')',s.pos);
    S2.names=s.names;
  }else if(s.kind==='mode'){
    let arr;
    if(s.arr)arr=s.arr;
    else{if(!env.modes.has(s.name))throw new MotError('Unknown mode "'+s.name+'". Built in: '+Object.keys(BUILTIN_MODES).join(', '),s.pos);arr=env.modes.get(s.name);}
    if(arr===null)S2.mode=null;
    else{
      if(!arr.length)throw new MotError('A mode needs at least one note',s.pos);
      const u=[...new Set(arr)].sort((a,b)=>a-b);
      if(u[0]<0||u[u.length-1]>=S.N)throw new MotError('This mode uses note '+(u[u.length-1]>=S.N?u[u.length-1]:u[0])+', which is outside the current tuning of '+S.N+' notes (0\u2013'+(S.N-1)+'). Set the tuning first, or use "mode chromatic".',s.pos);
      S2.mode=u;
    }
  }else if(s.kind==='tempo')S2.tempo=s.value;
  else if(s.kind==='root')S2.root=s.hz;
  return S2;
}

function compile(src,opts){
  opts=opts||{};
  try{return compileInner(src,opts);}
  catch(e){
    if(e instanceof MotError){const lc=lineCol(src,e.pos||0);return{ok:false,error:{msg:e.message.replace(/"([^"]*)"/g,'\u201c$1\u201d'),pos:e.pos||0,line:lc.line,col:lc.col}};}
    throw e;
  }
}

function compileInner(src,opts){
  const prog=parseProgram(src);
  const env={vars:new Map(),modes:new Map(Object.entries(BUILTIN_MODES))};
  let S=rootScope();const exprs=[];let lastDef=null;
  for(const st of prog){
    if(st.type==='setting')S=applySetting(S,st.s,env);
    else if(st.type==='modedef')env.modes.set(st.name,st.arr);
    else if(st.type==='def'){env.vars.set(st.name,st);lastDef=st.name;}
    else exprs.push(st);
  }
  const ctx={env,G:S.tempo,instruments:opts.instruments||null,stack:[],depth:0};
  const tscale=T=>fdiv(ctx.G,T.tempo);
  const mk=(dur,ev,flags)=>({dur,ev,flags:flags||{}});
  const sortEv=ev=>ev.sort((a,b)=>fcmp(a.t,b.t)||a.n-b.n);
  const guard=(m,pos)=>{if(m.ev.length>EVENT_LIMIT)throw new MotError('That makes more than '+EVENT_LIMIT+' notes \u2014 try something shorter',pos);return m;};

  function seqMusic(list,pos){

function shape(kind,W,D,duty){
  const out=[],top=D-1;
  for(let i=0;i<W;i++){
    const x=i/W;let v;
    switch(kind){
      case 'sine':v=(Math.sin(x*2*Math.PI)+1)/2;break;
      case 'tri':v=x<.5?x*2:2-x*2;break;
      case 'saw':v=i/(W-1);break;
      case 'pulse':v=x<(duty||.5)?1:0;break;
      case 'organ':v=(Math.sin(x*2*Math.PI)+.5*Math.sin(x*4*Math.PI+.6)+.3*Math.sin(x*6*Math.PI+1.2));v=(v/1.8+1)/2;break;
      case 'random':v=Math.random();break;
      default:v=.5;
    }
    out.push(clamp(Math.round(v*top),0,top));
  }

}

/* =====================  audio engine  ===================== */
const Snd={
  ctx:null,master:null,analyser:null,cache:new Map(),
  ensure(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();

};
function buildBuffer(ctx,w){
  const sr=ctx.sampleRate;
  if(w.type==='noise'){
    const step=Math.max(1,Math.round(sr/Math.max(200,w.hz)));
    let buf,a;
    if(w.metal){
      const steps=127;buf=ctx.createBuffer(1,steps*step,sr);a=buf.getChannelData(0);
      let lf=0x7f;
      for(let s=0;s<steps;s++){const bit=(lf^(lf>>1))&1;lf=(lf>>1)|(bit<<6);const v=(lf&1)?1:-1;for(let k=0;k<step;k++)a[s*step+k]=v;}
    }else{
      const n=Math.floor(sr/step)*step;buf=ctx.createBuffer(1,n,sr);a=buf.getChannelData(0);
      for(let s=0;s<n;s+=step){const v=Math.random()*2-1;for(let k=0;k<step&&s+k<n;k++)a[s+k]=v;}
    }
    return{buf,type:'noise'};
  }
  const W=w.data.length,D=w.d,val=v=>(v/(D-1))*2-1;
  if(w.type==='shot'){
    const n=Math.max(16,Math.round(w.shotMs/1000*sr));const buf=ctx.createBuffer(1,n,sr),a=buf.getChannelData(0);
    for(let i=0;i<n;i++){
      const p=i/n*W,i0=Math.min(W-1,Math.floor(p));
      if(!w.smooth)a[i]=val(w.data[i0]);
      else{const f=p-i0;const v0=val(w.data[i0]),v1=val(w.data[Math.min(W-1,i0+1)]);a[i]=v0+(v1-v0)*f;}
    }
    const fade=Math.min(n>>2,Math.round(sr*.004));for(let k=0;k<fade;k++)a[n-1-k]*=k/fade;
    return{buf,type:'shot'};
  }
  const K=Math.ceil(512/W),Ln=W*K;const buf=ctx.createBuffer(1,Ln,sr),a=buf.getChannelData(0);
  let mean=0;
  for(let i=0;i<Ln;i++){
    const p=i/K,i0=Math.floor(p);
    if(!w.smooth)a[i]=val(w.data[i0]);
    else{const f=p-i0;const v0=val(w.data[i0]),v1=val(w.data[(i0+1)%W]);a[i]=v0+(v1-v0)*f;}
    mean+=a[i];
  }
  mean/=Ln;for(let i=0;i<Ln;i++)a[i]-=mean;
  let peak=0;for(let i=0;i<Ln;i++)peak=Math.max(peak,Math.abs(a[i]));

}
function adsrPts(e,dur,peak){
  const a=Math.max(e.a,.002),d=Math.max(e.d,.002),s=e.s*peak,r=Math.max(e.r,.006);
  const pts=[[0,0]];

  else if(dur<=a+d){pts.push([a,peak]);pts.push([dur,peak+(s-peak)*((dur-a)/d)]);}
  else{pts.push([a,peak]);pts.push([a+d,s]);pts.push([dur,s]);}
  const last=pts[pts.length-1][1];
  pts.push([dur+r,0]);
  return{pts,end:dur+r,last};
}
function playVoice(sess,inst,freq,t0,dur){
  const ctx=sess.ctx;
  if(sess.src.size>180)return;
  const wa=Lib.wave(inst.waveA);if(!wa)return;
  const wb=inst.mode!=='single'?Lib.wave(inst.waveB):null;
  dur=Math.max(dur,.02);
  const amp=ctx.createGain();amp.gain.value=0;amp.connect(sess.bus);
  const env=adsrPts(inst.amp,dur,1),base=.28*inst.gain;
  amp.gain.setValueAtTime(0,t0);
  for(let k=1;k<env.pts.length;k++)amp.gain.linearRampToValueAtTime(env.pts[k][1]*base,t0+env.pts[k][0]);
  const end=t0+env.end+.03;
  function slot(w,ref,out){
    const b=Snd.buffer(w);const src=ctx.createBufferSource();src.buffer=b.buf;
    let rate;

    else if(b.type==='shot'){rate=inst.follow?freq/ref:1;}
    else{src.loop=true;rate=inst.follow?freq/261.63:1;}

  }

  }else{
    const m=inst.morph,me=adsrPts(m,dur,clamp(m.depth,0,1));
    const ga=ctx.createGain(),gb=ctx.createGain();ga.connect(amp);gb.connect(amp);
    ga.gain.setValueAtTime(1,t0);gb.gain.setValueAtTime(0,t0);
    for(let k=1;k<me.pts.length;k++){const tt=t0+Math.min(me.pts[k][0],env.end);ga.gain.linearRampToValueAtTime(1-me.pts[k][1],tt);gb.gain.linearRampToValueAtTime(me.pts[k][1],tt);}
    slot(wa,inst.refA,ga);slot(wb,inst.refB,gb);
  }
}
const Player={
  s:null,listeners:[],
  on(fn){this.listeners.push(fn);},
  emit(){for(const f of this.listeners)f(this.s?this.s.o.tag:null);},
  tag(){return this.s?this.s.o.tag:null;},
  start(o){
    this.stop(true);
    const ctx=Snd.ensure();
    const bus=ctx.createGain();bus.connect(Snd.master);
    const s={o,ctx,bus,idx:0,t0:ctx.currentTime+.12,src:new Set(),timer:null,total:o.total};
    this.s=s;
    s.timer=setInterval(()=>this.tick(),50);
    this.tick();this.emit();
  },
  tick(){
    const s=this.s;if(!s)return;
    const now=s.ctx.currentTime,horizon=now+.8,ev=s.o.events;
    while(s.idx<ev.length){
      const e=ev[s.idx],at=s.t0+e.t;
      if(at>horizon)break;
      const inst=s.o.resolve(e.inst);
      if(inst)playVoice(s,inst,e.freq,Math.max(at,now+.003),e.d);
      s.idx++;
    }
    if(s.idx>=ev.length){
      const end=s.t0+s.total;
      if(s.o.loop&&s.total>.1){if(now+.8>=end){s.t0=end;s.idx=0;}}
      else if(now>end+1.8)this.stop();
    }
  },
  position(){const s=this.s;if(!s)return null;return clamp(s.ctx.currentTime-s.t0,0,s.total);},
  stop(quiet){
    const s=this.s;if(!s)return;
    clearInterval(s.timer);this.s=null;
    try{s.bus.gain.cancelScheduledValues(s.ctx.currentTime);s.bus.gain.setTargetAtTime(0,s.ctx.currentTime,.012);}catch(e){}
    setTimeout(()=>{for(const x of s.src){try{x.stop();}catch(e){}}try{s.bus.disconnect();}catch(e){}},120);
    if(!quiet)this.emit();
  }
};

/* =====================  syntax highlighting  ===================== */
const TOK=/(\/\/.*$)|(\b(?:tuning|register|names|mode|tempo|root|motif|play|with|section|staff|length|rest|of)\b)|(\b(?:rev|inv|fit|loop|sets-length|x\d+)\b)|(\b[A-Za-z_][A-Za-z0-9_]*(?=\s*:(?!\s*[whqest][.*\d\/]*(?![A-Za-z0-9_]))))|(:[whqest][.*\d\/]*(?![A-Za-z0-9_]))|(\bn?\d+(?:\.\d+)?[#b]*(?:\^-?\d+)?)|([\[\]\(\)\{\}])/g;
function hi(line){
  let out='',last=0;TOK.lastIndex=0;let m;
  while((m=TOK.exec(line))){
    if(m.index>last)out+=esc(line.slice(last,m.index));
    const cls=m[1]?'com':m[2]?'kw':m[3]?'mod':m[4]?'inst':m[5]?'dur':m[6]?'num':'pun';
    out+='<span class="tk-'+cls+'">'+esc(m[0])+'</span>';last=m.index+m[0].length;
    if(m[0].length===0)TOK.lastIndex++;
  }
  return out+esc(line.slice(last));
}

/* =====================  compose  ===================== */
const Compose={
  last:null,prev:null,
  compileNow(src){return compile(src,{instruments:Lib.names(),defaultInst:Lib.defaultName()});},
  init(){
    this.ta=$('#code');this.hlIn=$('#hlIn');this.gut=$('#gutIn');
    const saved=store.get('motynth.code.v1');
    this.ta.value=saved!=null&&saved.trim()?saved:EXAMPLES[0].code;
    this.errLine=0;
    const redo=debounce(()=>this.live(),220);
    this.ta.addEventListener('input',()=>{this.render();redo();store.set('motynth.code.v1',this.ta.value);$('#restore').hidden=true;});
    this.ta.addEventListener('scroll',()=>this.sync());
    this.ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){
        e.preventDefault();const t=this.ta,a=t.selectionStart,b=t.selectionEnd;
        t.setRangeText('  ',a,b,'end');t.dispatchEvent(new Event('input'));
      }else if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();this.play(true);}
    });
    const sel=$('#examples');
    EXAMPLES.forEach((x,i)=>sel.append(h('option',{value:String(i)},x.name)));
    sel.addEventListener('change',()=>{
      if(sel.value==='')return;
      this.prev=this.ta.value;this.ta.value=EXAMPLES[+sel.value].code;sel.value='';
      this.render();this.live();store.set('motynth.code.v1',this.ta.value);$('#restore').hidden=false;
    });
    $('#restore').addEventListener('click',()=>{if(this.prev!=null){this.ta.value=this.prev;this.render();this.live();store.set('motynth.code.v1',this.ta.value);}$('#restore').hidden=true;});
    this.render();this.live();
  },
  render(){
    const lines=this.ta.value.split('\n');
    this.hlIn.innerHTML=lines.map((l,i)=>'<div class="ln'+(this.errLine===i+1?' bad':'')+'">'+(hi(l)||' ')+'</div>').join('');
    this.gut.innerHTML=lines.map((_,i)=>'<div class="'+(this.errLine===i+1?'bad':'')+'">'+(i+1)+'</div>').join('');
    this.sync();
  },
  sync(){
    this.hlIn.style.transform='translate('+(-this.ta.scrollLeft)+'px,'+(-this.ta.scrollTop)+'px)';

  },
  live(){

    st.replaceChildren(h('span',{class:'dot'}),res.ok
      ?h('span',{},'Ready. ',h('b',{},fmtTime(res.total)),' long, ',res.count+' notes, '+Math.round(res.bpm*10)/10+' bpm.')
      :h('span',{},h('b',{},'Line '+res.error.line+': '),res.error.msg));
    drawRoll(res.ok?res:null);
    return res;
  },
  play(restart){
    if(!restart&&Player.tag()==='compose'){Player.stop();return;}
    Snd.ensure();
    const res=this.live();
    if(!res.ok){this.ta.focus();return;}
    if(!res.events.length){return;}
    Player.start({tag:'compose',events:res.events,total:res.total,loop:$('#loop').checked,resolve:n=>Lib.inst(n)});
  }

/* piano roll */
let rollState=null;
function drawRoll(res){
  const cv=$('#roll'),box=cv.parentElement;
  const dpr=window.devicePixelRatio||1,W=box.clientWidth-4,H=box.clientHeight-4;
  if(W<=0||H<=0)return;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,W,H);
  rollState=res;
  const empty=$('#rollEmpty'),leg=$('#legend'),stats=$('#stats');
  if(!res||!res.events.length){
    empty.hidden=false;leg.replaceChildren();stats.replaceChildren();return;
  }
  empty.hidden=true;
  const pad=6,total=Math.max(res.total,.1);
  const pitched=[],unp=[];
  for(const e of res.events){const ins=Lib.inst(e.inst);((ins&&!ins.follow)||e.hit&&!(ins&&ins.follow)?unp:pitched).push(e);}
  const unpNames=[...new Set(unp.map(e=>e.inst))];
  const bandRow=Math.min(10,Math.max(5,Math.floor((H*.38)/Math.max(1,unpNames.length))));
  const bandH=unpNames.length?unpNames.length*bandRow+6:0;
  const topH=H-bandH-pad*2;
  const spw=240/res.bpm;
  g.fillStyle=cssv('--cell-grid');
  for(let t=0;t<total;t+=spw)g.fillRect(Math.round(pad+t/total*(W-pad*2)),0,1,H);
  if(bandH){g.fillRect(0,H-bandH-pad+2,W,1);}
  if(pitched.length){
    let lo=1e9,hi_=-1e9;for(const e of pitched){lo=Math.min(lo,e.n);hi_=Math.max(hi_,e.n);}
    const rows=hi_-lo+3;const rh=clamp(topH/rows,2,14);const used=rh*rows;const oy=pad+(topH-used)/2;
    for(const e of pitched){
      const x=pad+e.t/total*(W-pad*2),w=Math.max(2,e.d/total*(W-pad*2)-1);
      g.fillStyle=instColor(e.inst);
      g.fillRect(Math.round(x),Math.round(oy+(hi_-e.n+1)*rh),Math.round(w),Math.max(2,Math.floor(rh)-1));
    }
  }
  const by0=H-bandH-pad+5;
  for(const e of unp){
    const row=unpNames.indexOf(e.inst);
    const x=pad+e.t/total*(W-pad*2);
    g.fillStyle=instColor(e.inst);
    g.fillRect(Math.round(x),by0+row*bandRow,Math.max(2,Math.min(6,Math.round(e.d/total*(W-pad*2)))),Math.max(2,bandRow-2));
  }
  leg.replaceChildren(...res.used.map(n=>h('span',{},h('i',{style:'background:'+instColor(n)}),n)));
  stats.replaceChildren(h('span',{},'Length ',h('b',{},fmtTime(res.total))),h('span',{},'Notes ',h('b',{},res.count)),h('span',{},'Tempo ',h('b',{},Math.round(res.bpm*10)/10)));
}

function frame(){
  const ph=$('#playhead'),cv=$('#scope'),g=cv.getContext('2d');
  const pos=Player.position();
  if(Player.tag()==='compose'&&rollState&&rollState.ok!==false&&pos!=null){
    const box=$('#roll').parentElement,W=box.clientWidth-4,pad=6;
    ph.style.display='block';ph.style.left=Math.round(pad+pos/Math.max(rollState.total,.1)*(W-pad*2))+'px';
  }else ph.style.display='none';
  g.fillStyle='#0a0c1b';g.fillRect(0,0,cv.width,cv.height);
  if(Player.s&&Snd.analyser){
    const data=new Uint8Array(Snd.analyser.fftSize);Snd.analyser.getByteTimeDomainData(data);
    g.fillStyle='#2ed3bf';
    for(let x=0;x<cv.width;x++){const v=data[Math.floor(x/cv.width*data.length*.5)]/255;const y=Math.round((1-v)*(cv.height-2));g.fillRect(x,clamp(y,0,cv.height-2),1,2);}
  }else{g.fillStyle='#3b4380';g.fillRect(0,cv.height/2,cv.width,1);}

}

function drawThumb(cv,w){

  const W=w.type==='noise'?24:w.data.length,H=10;
  cv.width=W;cv.height=H;
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,W,H);
  g.fillStyle=cssv('--cell-on');
  if(w.type==='noise'){
    let s=w.id.length*7+(w.metal?3:1);
    for(let i=0;i<W;i++){s=(s*1103515245+12345)&0x7fffffff;const v=Math.floor((s/0x7fffffff)*(H-2));g.fillRect(i,v,1,2);}
    return;
  }
  for(let i=0;i<W;i++){const v=Math.round((1-w.data[i]/(w.d-1))*(H-2));g.fillRect(i,v,1,2);}
}
function drawEnv(cv,e){
  const g=cv.getContext('2d'),W=56,H=14;cv.width=W;cv.height=H;
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,W,H);
  const hold=Math.max(.12,(e.a+e.d)*.6),T=e.a+e.d+hold+e.r;
  const fill=cssv('--cell-fill'),on=cssv('--cell-on');
  for(let x=0;x<W;x++){
    const t=(x+.5)/W*T;let v;
    if(t<e.a)v=e.a>0?t/e.a:1;
    else if(t<e.a+e.d)v=1+(e.s-1)*((t-e.a)/Math.max(e.d,1e-6));
    else if(t<e.a+e.d+hold)v=e.s;
    else v=e.s*(1-(t-e.a-e.d-hold)/Math.max(e.r,1e-6));
    v=clamp(v,0,1);const hh=Math.round(v*(H-2));
    g.fillStyle=fill;g.fillRect(x,H-hh,1,hh);g.fillStyle=on;g.fillRect(x,H-hh-1,1,1);
  }
  g.fillStyle=cssv('--cell-grid');
  g.fillRect(Math.round((e.a+e.d)/T*W),0,1,H);g.fillRect(Math.round((e.a+e.d+hold)/T*W),0,1,H);
}
function drawWave(cv,w){
  const W=w.data.length,D=w.d,cw=Math.floor(448/W),ch=Math.floor(224/D);
  cv.width=W*cw;cv.height=D*ch;
  const g=cv.getContext('2d');
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,cv.width,cv.height);
  const fill=cssv('--cell-fill'),on=cssv('--cell-on'),grid=cssv('--cell-grid'),zero=cssv('--cell-zero');
  const mid=D/2;
  for(let i=0;i<W;i++){
    const row=D-1-w.data[i];
    g.fillStyle=fill;
    if(row<mid)g.fillRect(i*cw,row*ch,cw,(mid-row)*ch);
    else g.fillRect(i*cw,mid*ch,cw,(row-mid+1)*ch);
  }
  g.fillStyle=grid;
  for(let i=1;i<W;i++)g.fillRect(i*cw,0,1,cv.height);
  for(let j=1;j<D;j++)g.fillRect(0,j*ch,cv.width,1);
  g.fillStyle=zero;g.fillRect(0,mid*ch-1,cv.width,2);
  g.fillStyle=on;
  for(let i=0;i<W;i++){const row=D-1-w.data[i];g.fillRect(i*cw+1,row*ch+1,cw-1,ch-1);}
  if(w.smooth){
    g.strokeStyle=zero;g.lineWidth=2;g.beginPath();
    for(let i=0;i<W;i++){const x=i*cw+cw/2,y=(D-1-w.data[i])*ch+ch/2;i?g.lineTo(x,y):g.moveTo(x,y);}
    g.stroke();
  }
}

/* =====================  sounds: test bar  ===================== */
const TESTS=[['Melody','[1:e 3 5 8 5 3 1:q]'],['Scale','[1:e 2 3 4 5 6 7 8:q]'],['Chords','[(1 3 5):h (2 4 6):h]'],['Low line','[1:e 1 5 1 4 1 5:q]'],['Hits','[x:q x x:e x x:q]']];
const Test={
  inst:null,
  init(){
    const sel=$('#testPreset');
    TESTS.forEach((t,i)=>sel.append(h('option',{value:String(i)},t[0])));
    sel.addEventListener('change',()=>{$('#testMotif').value=TESTS[+sel.value][1];this.play();});
    $('#testPlay').addEventListener('click',()=>{if(Player.tag()==='test')Player.stop();else this.play();});
    $('#testMotif').addEventListener('change',()=>this.play());
    $('#testOct').addEventListener('change',()=>this.play());
    this.sched=debounce(()=>{if($('#testAuto').checked&&!$('#view-sounds').hidden)this.play();},380);
  },
  schedule(){this.sched();},
  play(){
    const inst=curInst();if(!inst)return;
    const msg=$('#testMsg');msg.textContent='';
    const oct=parseInt($('#testOct').value,10)||0;
    const res=compile('piece = ('+$('#testMotif').value+')^'+oct,{instruments:null,defaultInst:null});
    if(!res.ok){msg.textContent=res.error.msg;return;}
    Snd.ensure();
    Player.start({tag:'test',events:res.events,total:res.total,loop:false,resolve:()=>inst});
  }
};

function slider(label,min,max,step,value,fmt,onInput){
  const out=h('output',{},fmt(value));
  const inp=h('input',{type:'range',min,max,step,value,oninput:e=>{const v=parseFloat(e.target.value);out.textContent=fmt(v);onInput(v);}});
  return h('label',{class:'sl'},h('span',{class:'sl-l'},label),inp,out);
}
function timeSlider(label,max,value,onInput){
  const toV=t=>Math.round(Math.sqrt(clamp(t/max,0,1))*1000),toT=v=>Math.round((v/1000)**2*max*1000)/1000;
  return slider(label,0,1000,1,toV(value),v=>fmtT(toT(v)),v=>onInput(toT(v)));
}
function envBlock(env,withDepth,onChange){
  const cv=h('canvas',{class:'envcv'});
  const redraw=()=>drawEnv(cv,env);redraw();
  const ch=()=>{redraw();onChange();};
  const out=[cv,
    timeSlider('Attack',1.5,env.a,v=>{env.a=v;ch();}),
    timeSlider('Decay',2,env.d,v=>{env.d=v;ch();}),
    slider('Sustain',0,1,.01,env.s,v=>Math.round(v*100)+'%',v=>{env.s=v;ch();}),
    timeSlider('Release',2,env.r,v=>{env.r=v;ch();})];
  if(withDepth)out.push(slider('Amount of B',0,1,.01,env.depth,v=>Math.round(v*100)+'%',v=>{env.depth=v;ch();}));
  return out;
}

function renderInstEditor(){

  const warn=h('div',{class:'warn',role:'alert'});

    oninput:e=>{const v=e.target.value;warn.textContent=v===inst.name||(/^[A-Za-z_][A-Za-z0-9_]*$/.test(v)&&!Lib.inst(v))?'':'Use letters, digits and _ (starting with a letter), and a name no other instrument has.';},
    onchange:e=>{const v=e.target.value;if(v===inst.name)return;
      if(/^[A-Za-z_][A-Za-z0-9_]*$/.test(v)&&!Lib.inst(v)&&!['x','r','rest'].includes(v)){inst.name=v;Lib.selInst=v;warn.textContent='';touch();renderLists();Compose.live();}

  const modeDesc={single:'One waveform, played at the pitch of each note.',pair:'Two waveforms that crossfade by pitch. Low notes use A, high notes use B, and in between they blend. The reference pitches say where each one is at full strength.',morph:'The timbre changes during each note. It starts on A and blends toward B following the morph envelope.'};

    inst.mode=k;if(k!=='single'&&(!inst.waveB||!Lib.wave(inst.waveB)))inst.waveB=(Lib.waves.find(w=>w.id!==inst.waveA)||Lib.waves[0]).id;
    touch();renderInstEditor();}},l)));
  function slot(label,key,refKey,isB){
    const w=Lib.wave(inst[key]);
    const cv=h('canvas',{title:'Edit this wave',onclick:()=>{Lib.selWave=inst[key];renderLists();renderWaveEditor();}});if(w)drawThumb(cv,w);
    const sel=h('select',{'aria-label':'Wave '+label,onchange:e=>{inst[key]=e.target.value;touch();renderInstEditor();}},Lib.waves.map(x=>h('option',{value:x.id,selected:x.id===inst[key]},x.name)));

  }

  host.append(
    h('h2',{},'Instrument'),
    h('div',{class:'field'},h('span',{class:'l'},'Name in code'),name),warn,
    h('div',{class:'field'},h('span',{class:'l'},'Sound type'),seg),
    h('p',{class:'hint'},modeDesc[inst.mode]),

    slider('Volume',0,2,.01,inst.gain,v=>Math.round(v*100)+'%',v=>{inst.gain=v;touch();}),
    h('h3',{},'Volume envelope'),

    slider('Start offset',-4800,4800,50,inst.pitch.cents,v=>(v>0?'+':'')+(v/100)+' st',v=>{inst.pitch.cents=v;touch();}),
    timeSlider('Glide time',.6,inst.pitch.time,v=>{inst.pitch.time=Math.max(.005,v);touch();}),
    h('div',{class:'row',style:'margin-top:16px'},
      h('button',{class:'btn small',onclick:()=>{const c=JSON.parse(JSON.stringify(inst));c.name=uniqueName(inst.name,Lib.names());Lib.insts.push(c);Lib.selInst=c.name;touch();renderSounds();}},'Duplicate'),
      h('button',{class:'btn small danger',disabled:Lib.insts.length<2,onclick:()=>{Lib.insts=Lib.insts.filter(x=>x!==inst);Lib.selInst=Lib.insts[0].name;Lib.save();renderSounds();Compose.live();}},'Delete'))
  );
}

function resampleData(data,W,D,nW,nD){
  const out=[];for(let i=0;i<nW;i++){const v=data[Math.min(W-1,Math.floor(i/nW*W))];out.push(clamp(Math.round(v/(D-1)*(nD-1)),0,nD-1));}return out;
}
function renderWaveEditor(){
  const host=$('#waveEd');host.replaceChildren();
  const w=curWave();
  if(!w){host.append(h('h2',{},'Wave'));return;}
  const change=()=>{Lib.save();Test.schedule();};
  const lists=()=>renderLists();
  host.append(h('h2',{},'Wave'));
  host.append(h('div',{class:'field'},h('span',{class:'l'},'Name'),h('input',{type:'text',value:w.name,maxLength:28,'aria-label':'Wave name',onchange:e=>{w.name=e.target.value||w.name;Lib.save();renderLists();renderInstEditor();}})));
  host.append(h('div',{class:'field'},h('span',{class:'l'},'Kind'),h('div',{class:'seg',role:'group','aria-label':'Wave kind'},[['cycle','Cycle'],['shot','One-shot'],['noise','Noise']].map(([k,l])=>h('button',{'aria-pressed':w.type===k?'true':'false',onclick:()=>{w.type=k;change();renderWaveEditor();lists();renderInstEditor();}},l)))));
  if(w.type==='noise'){
    host.append(
      h('p',{class:'hint'},'Random steps, held for a short grain. A low rate sounds crunchy; a high rate sounds like static. Metallic repeats a short 127-step pattern, which rings like a hi-hat.'),
      slider('Grain rate',500,44100,100,w.hz,v=>Math.round(v)+' Hz',v=>{w.hz=v;change();}),
      h('label',{class:'field'},h('input',{type:'checkbox',checked:w.metal,onchange:e=>{w.metal=e.target.checked;change();lists();}}),h('span',{},'Metallic (short repeating pattern)'))
    );
    return;
  }
  const cv=h('canvas',{class:'wavecv',role:'img','aria-label':'Waveform pixel grid. Click or drag to draw.'});
  const redraw=()=>{drawWave(cv,w);};
  redraw();
  let drawing=false,lastCol=-1,lastVal=0;
  const setAt=(ev)=>{
    const r=cv.getBoundingClientRect(),W=w.data.length,D=w.d;
    const col=clamp(Math.floor((ev.clientX-r.left)/r.width*W),0,W-1),row=clamp(Math.floor((ev.clientY-r.top)/r.height*D),0,D-1),val=D-1-row;
    if(lastCol>=0&&Math.abs(col-lastCol)>1){const a=Math.min(col,lastCol),b=Math.max(col,lastCol);for(let c=a;c<=b;c++){const t=(c-lastCol)/(col-lastCol);w.data[c]=Math.round(lastVal+(val-lastVal)*t);}}
    else w.data[col]=val;
    lastCol=col;lastVal=val;redraw();
  };
  cv.addEventListener('pointerdown',e=>{drawing=true;lastCol=-1;cv.setPointerCapture(e.pointerId);setAt(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drawing)setAt(e);});
  const end=()=>{if(!drawing)return;drawing=false;lastCol=-1;change();lists();renderInstEditor();};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  host.append(cv);
  host.append(h('div',{class:'row'},
    h('span',{class:'rowl'},'Width'),
    h('select',{'aria-label':'Width in pixels',onchange:e=>{const nW=+e.target.value;w.data=resampleData(w.data,w.data.length,w.d,nW,w.d);change();renderWaveEditor();lists();}},[8,16,32,64].map(n=>h('option',{value:n,selected:w.data.length===n},n+' px'))),
    h('span',{class:'rowl'},'Levels'),
    h('select',{'aria-label':'Number of levels',onchange:e=>{const nD=+e.target.value;w.data=resampleData(w.data,w.data.length,w.d,w.data.length,nD);w.d=nD;change();renderWaveEditor();lists();}},[2,4,8,16].map(n=>h('option',{value:n,selected:w.d===n},n)))));
  host.append(h('label',{class:'field'},h('input',{type:'checkbox',checked:w.smooth,onchange:e=>{w.smooth=e.target.checked;redraw();change();}}),h('span',{},'Smooth the steps (off keeps the crunch)')));
  if(w.type==='shot')host.append(slider('Length',10,600,5,w.shotMs,v=>Math.round(v)+' ms',v=>{w.shotMs=v;change();}),h('p',{class:'hint'},'Plays once through the grid at the instrument\u2019s reference pitch, and is sped up or slowed down to follow other notes.'));
  else host.append(h('p',{class:'hint'},'One cycle of the wave. It repeats at the pitch of each note.'));
  const apply=(fn)=>()=>{fn();redraw();change();lists();renderInstEditor();};
  const gen=k=>apply(()=>{w.data=shape(k,w.data.length,w.d,k==='pulse'?.25:undefined);});
  host.append(h('div',{class:'row'},h('span',{class:'rowl'},'Start from'),
    ...[['sine','Sine'],['tri','Triangle'],['saw','Saw'],['pulse','Pulse'],['organ','Organ'],['random','Random']].map(([k,l])=>h('button',{class:'btn small',onclick:gen(k)},l))));
  host.append(h('div',{class:'row'},h('span',{class:'rowl'},'Edit'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data=w.data.map(v=>w.d-1-v);})},'Flip'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data=w.data.slice().reverse();})},'Mirror'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data.unshift(w.data.pop());})},'Shift right'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data.push(w.data.shift());})},'Shift left'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data=w.data.map(()=>Math.floor(w.d/2));})},'Clear'),
    h('button',{class:'btn small danger',disabled:Lib.waves.length<2,onclick:()=>{
      const id=w.id;const other=Lib.waves.find(x=>x.id!==id);
      for(const i of Lib.insts){if(i.waveA===id)i.waveA=other.id;if(i.waveB===id)i.waveB=other.id;}
      Lib.waves=Lib.waves.filter(x=>x.id!==id);Lib.selWave=other.id;Lib.save();renderSounds();
    }},'Delete wave')));
  host.append(h('ul',{class:'tiplist'},h('li',{},'Click and drag on the grid to set each column.'),h('li',{},'The pink line is silence; a wave that sits above or below it is re-centered automatically.')));
}

/* =====================  learn  ===================== */
const Learn={
  idx:0,
  init(){this.render();},
  render(){
    const nav=$('#lessonNav');nav.replaceChildren(h('h2',{style:'margin-bottom:10px;font-size:18px'},'Lessons'),
      ...LESSONS.map((l,i)=>h('button',{'aria-current':i===this.idx?'true':'false',onclick:()=>{this.idx=i;this.render();window.scrollTo({top:0});}},l.title)));
    const art=$('#lesson');art.replaceChildren();
    const L=LESSONS[this.idx];
    art.append(h('h2',{},L.title));
    if(L.ref){
      art.append(h('p',{},'Everything the language understands, in one place.'));
      for(const [grp,rows] of REFERENCE)art.append(h('h3',{},grp),h('table',{class:'reftbl'},h('tbody',{},rows.map(r=>h('tr',{},h('td',{},r[0]),h('td',{},r[1]))))));
    }
    L.blocks.forEach((b,k)=>{
      if(b.p)art.append(h('p',{},b.p));
      else if(b.code)art.append(this.snippet(b.code,L.id+'-'+k));
    });
    art.append(h('div',{class:'pager'},
      this.idx>0?h('button',{class:'btn',onclick:()=>{this.idx--;this.render();window.scrollTo({top:0});}},'Previous: '+LESSONS[this.idx-1].title):h('span'),
      this.idx<LESSONS.length-1?h('button',{class:'btn',onclick:()=>{this.idx++;this.render();window.scrollTo({top:0});}},'Next: '+LESSONS[this.idx+1].title):h('span')));
    refreshTransport();
  },
  snippet(code,id){
    const msg=h('span',{class:'snip-msg',role:'alert'});
    const play=h('button',{class:'btn small','data-snip':id,onclick:()=>{
      if(Player.tag()===id){Player.stop();return;}
      msg.textContent='';
      const res=compile(code,{instruments:Lib.names(),defaultInst:Lib.defaultName()});
      if(!res.ok){msg.textContent='Line '+res.error.line+': '+res.error.msg;return;}
      Snd.ensure();
      Player.start({tag:id,events:res.events,total:res.total,loop:false,resolve:n=>Lib.inst(n)});
    }});
    const open=h('button',{class:'btn small',onclick:()=>{Compose.ta.value=code;store.set('motynth.code.v1',code);Compose.render();showTab('compose');Compose.live();}},'Open in Compose');
    return h('div',{class:'snip'},h('pre',{html:code.split('\n').map(hi).join('\n')}),h('div',{class:'snip-bar'},play,open,msg));
  }
};

/* =====================  tabs & boot  ===================== */
function showTab(name){
  for(const t of ['compose','sounds','learn']){
    $('#view-'+t).hidden=t!==name;
    $('#tab-'+t).setAttribute('aria-selected',t===name?'true':'false');
  }
  if(name==='compose'){Compose.render();Compose.live();}
  if(name==='sounds')renderSounds();
  store.set('motynth.tab',name);
}
function buildLogo(){
  const cols=[2,3,5,6,5,3,1,2,4,5],cols2=['#7d90ff','#ff6fa3','#ffc04a','#2ed3bf','#a98cff'];
  const S=5,G=1,svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+cols.length*(S+G)+' '+6*(S+G));svg.setAttribute('width',cols.length*(S+G)*.9);svg.setAttribute('height',6*(S+G)*.9);svg.setAttribute('aria-hidden','true');
  cols.forEach((n,i)=>{for(let k=0;k<n;k++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',i*(S+G));r.setAttribute('y',(5-k)*(S+G));r.setAttribute('width',S);r.setAttribute('height',S);r.setAttribute('fill',cols2[(i+k)%5]);svg.append(r);}});
  $('#logo').replaceChildren(svg);
}
function boot(){
  Lib.load();
  buildLogo();
  Compose.init();Test.init();Learn.init();
  Player.on(refreshTransport);
  $('#playbtn').addEventListener('click',()=>{Snd.ensure();Compose.play();});
  ['compose','sounds','learn'].forEach(t=>$('#tab-'+t).addEventListener('click',()=>showTab(t)));
  $('#testMotif').value=TESTS[0][1];
  refreshTransport();
  const t=store.get('motynth.tab');showTab(['compose','sounds','learn'].includes(t)?t:'compose');
  window.addEventListener('resize',debounce(()=>{if(!$('#view-compose').hidden)drawRoll(Compose.last&&Compose.last.ok?Compose.last:null);},150));
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>showTab(store.get('motynth.tab')||'compose'));
  requestAnimationFrame(frame);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&Player.s)Player.stop();});

boot();
