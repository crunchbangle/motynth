<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motynth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span id="logo"></span><h1 class="name">Motynth</h1></div>
  <div class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-compose" aria-selected="true" aria-controls="view-compose">Compose</button>
    <button class="tab" role="tab" id="tab-sounds" aria-selected="false" aria-controls="view-sounds">Sounds</button>
    <button class="tab" role="tab" id="tab-learn" aria-selected="false" aria-controls="view-learn">Learn</button>
  </div>
  <div class="transport">
    <label><input type="checkbox" id="loop"> Loop</label>
    <canvas id="scope" width="48" height="16" aria-hidden="true"></canvas>
    <button class="btn" id="playbtn" aria-pressed="false"></button>
  </div>
</header>
<main>
  <section id="view-compose" class="compose" role="tabpanel" aria-labelledby="tab-compose">
    <div>
      <div class="bar">
        <select id="examples" aria-label="Load an example"><option value="">Load an example…</option></select>
        <button class="btn small" id="restore" hidden>Restore previous text</button>
        <span class="grow"></span>
        <span class="hint">Ctrl+Enter plays</span>
      </div>
      <div class="editor">
        <div class="gutter" aria-hidden="true"><div id="gutIn"></div></div>
        <div class="edwrap">
          <div class="hl" aria-hidden="true"><div class="hl-in" id="hlIn"></div></div>
          <textarea class="code" id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="Composition code"></textarea>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <div class="panel">
      <h2>Score</h2>
      <div class="roll-wrap">
        <canvas id="roll" aria-label="Piano roll of the composition"></canvas>
        <div id="playhead"></div>
        <div class="roll-empty" id="rollEmpty">Your notes appear here once the code can play.</div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="stats" id="stats"></div>
      <p class="hint" style="margin-top:14px">New here? The Learn tab has six short lessons, each with snippets you can play.</p>
    </div>
  </section>

  <section id="view-sounds" role="tabpanel" aria-labelledby="tab-sounds" hidden>
    <div class="panel testbar">
      <button class="btn primary" id="testPlay"></button>
      <input type="text" id="testMotif" spellcheck="false" aria-label="Test motif">
      <select id="testPreset" aria-label="Test motif presets"></select>
      <label>Octave <input type="number" class="oct" id="testOct" value="0" min="-3" max="3" step="1"></label>
      <label><input type="checkbox" id="testAuto" checked> Play after each change</label>
      <span class="warn" id="testMsg" role="alert"></span>
    </div>
    <div class="sounds">
      <div class="panel" id="lists"></div>
      <div class="panel" id="instEd"></div>
      <div class="panel wave-col" id="waveEd"></div>
    </div>
  </section>

  <section id="view-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
    <div class="learn">
      <nav class="panel lessons" id="lessonNav" aria-label="Lessons"></nav>
      <article id="lesson" class="lesson"></article>
    </div>
  </section>
</main>
<script type="module">
import {compile} from './src/engine/index.js';
import {LESSONS, REFERENCE} from './src/content/lessons.js';
import {EXAMPLES} from './src/content/examples.js';

/* =====================  helpers  ===================== */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='style')el.style.cssText=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='html')el.innerHTML=v;
    else if(k in el){try{el[k]=v;}catch(e){el.setAttribute(k,v);}}
    else el.setAttribute(k,v);
  }
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(String(kid)));}
  return el;
}
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const uid=()=>Math.random().toString(36).slice(2,9);
const PALETTE=['--blue','--pink','--amber','--teal','--violet','--red'];
const fmtTime=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtT=v=>v<1?Math.round(v*1000)+' ms':v.toFixed(2)+' s';
const ICON_PLAY='<svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1 0h2v1h1v1h1v1h1v2H5v1H4v1H3v1H1z"/></svg>';
const ICON_STOP='<svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1h6v6H1z"/></svg>';

/* =====================  sound library  ===================== */
function shape(kind,W,D,duty){
  const out=[],top=D-1;
  for(let i=0;i<W;i++){
    const x=i/W;let v;
    switch(kind){
      case 'sine':v=(Math.sin(x*2*Math.PI)+1)/2;break;
      case 'tri':v=x<.5?x*2:2-x*2;break;
      case 'saw':v=i/(W-1);break;
      case 'pulse':v=x<(duty||.5)?1:0;break;
      case 'organ':v=(Math.sin(x*2*Math.PI)+.5*Math.sin(x*4*Math.PI+.6)+.3*Math.sin(x*6*Math.PI+1.2));v=(v/1.8+1)/2;break;
      case 'random':v=Math.random();break;
      default:v=.5;
    }
    out.push(clamp(Math.round(v*top),0,top));
  }
  return out;
}
function mkWave(id,name,kind,o){
  o=o||{};const W=o.w||32,D=o.d||16;
  return{id,name,type:o.type||'cycle',w:W,d:D,data:shape(kind,W,D,o.duty),smooth:false,shotMs:o.shotMs||90,hz:o.hz||11025,metal:!!o.metal};
}
function mkInst(name,o){
  return Object.assign({name,mode:'single',waveA:'w-square',waveB:null,refA:261.63,refB:1046.5,follow:true,gain:.7,amp:{a:.004,d:.08,s:.7,r:.08},morph:{a:.002,d:.3,s:0,r:.05,depth:1},pitch:{cents:0,time:.08}},o);
}
function starterLibrary(){
  return{
    waves:[
      mkWave('w-pulse','Pulse 25%','pulse',{duty:.25}),
      mkWave('w-square','Square','pulse',{duty:.5}),
      mkWave('w-tri','Triangle','tri'),
      mkWave('w-saw','Saw','saw'),
      mkWave('w-sine','Sine','sine'),
      mkWave('w-organ','Organ','organ'),
      mkWave('w-noise','White noise','sine',{type:'noise',hz:16000}),
      mkWave('w-metal','Metal noise','sine',{type:'noise',hz:7000,metal:true})
    ],
    insts:[
      mkInst('pulse',{waveA:'w-pulse',gain:.6,amp:{a:.004,d:.07,s:.65,r:.07}}),
      mkInst('square',{waveA:'w-square',gain:.5}),
      mkInst('tri',{waveA:'w-tri',gain:.95,amp:{a:.005,d:.04,s:.9,r:.1}}),
      mkInst('saw',{waveA:'w-saw',gain:.5,amp:{a:.006,d:.12,s:.6,r:.1}}),
      mkInst('bass',{waveA:'w-organ',gain:.95,amp:{a:.003,d:.2,s:.5,r:.06}}),
      mkInst('pluck',{mode:'morph',waveA:'w-tri',waveB:'w-pulse',gain:.8,amp:{a:.002,d:.4,s:.1,r:.12},morph:{a:.002,d:.28,s:0,r:.05,depth:1}}),
      mkInst('keys',{mode:'pair',waveA:'w-tri',waveB:'w-pulse',refA:130.8,refB:1046.5,gain:.8,amp:{a:.004,d:.25,s:.35,r:.2}}),
      mkInst('kick',{waveA:'w-sine',follow:false,refA:50,gain:1.5,amp:{a:.001,d:.24,s:0,r:.02},pitch:{cents:3600,time:.1}}),
      mkInst('snare',{waveA:'w-noise',follow:false,gain:.8,amp:{a:.001,d:.14,s:0,r:.03}}),
      mkInst('hat',{waveA:'w-metal',follow:false,gain:.55,amp:{a:.001,d:.04,s:0,r:.01}}),
      mkInst('tom',{waveA:'w-sine',follow:true,gain:1.2,amp:{a:.001,d:.3,s:0,r:.04},pitch:{cents:900,time:.09}})
    ]
  };
}
const Lib={
  waves:[],insts:[],selInst:null,selWave:null,
  wave(id){return this.waves.find(w=>w.id===id);},
  inst(name){return this.insts.find(i=>i.name===name);},
  names(){return new Set(this.insts.map(i=>i.name));},
  defaultName(){return this.inst('pulse')?'pulse':(this.insts[0]&&this.insts[0].name)||null;},
  reset(){const s=starterLibrary();this.waves=s.waves;this.insts=s.insts;this.selInst=this.insts[0].name;this.selWave=this.waves[0].id;},
  load(){
    const raw=store.get('motynth.lib.v1');
    try{
      const o=JSON.parse(raw);
      if(o&&Array.isArray(o.waves)&&o.waves.length&&Array.isArray(o.insts)&&o.insts.length){
        this.waves=o.waves;this.insts=o.insts;
        for(const i of this.insts){i.amp=i.amp||{a:.004,d:.08,s:.7,r:.08};i.morph=i.morph||{a:.002,d:.3,s:0,r:.05,depth:1};i.pitch=i.pitch||{cents:0,time:.08};if(!this.wave(i.waveA))i.waveA=this.waves[0].id;if(i.waveB&&!this.wave(i.waveB))i.waveB=null;}
        this.selInst=this.insts[0].name;this.selWave=this.waves[0].id;return;
      }
    }catch(e){}
    this.reset();
  },
  save:debounce(function(){store.set('motynth.lib.v1',JSON.stringify({waves:Lib.waves,insts:Lib.insts}));},400)
};
function uniqueName(base,taken){let n=base,k=2;while(taken.has(n)){n=base+'_'+k++;}return n;}
function instColor(name){const i=Lib.insts.findIndex(x=>x.name===name);return cssv(PALETTE[(i<0?0:i)%PALETTE.length]);}

/* =====================  audio engine  ===================== */
const Snd={
  ctx:null,master:null,analyser:null,cache:new Map(),
  ensure(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=.9;
      const comp=this.ctx.createDynamicsCompressor();
      comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
      this.analyser=this.ctx.createAnalyser();this.analyser.fftSize=512;
      this.master.connect(comp);comp.connect(this.analyser);this.analyser.connect(this.ctx.destination);
    }
    if(this.ctx.state==='suspended')this.ctx.resume();
    return this.ctx;
  },
  buffer(w){
    const key=[w.type,w.d,w.smooth?1:0,w.shotMs,w.hz,w.metal?1:0,w.data.join(',')].join('|');
    let b=this.cache.get(key);if(b)return b;
    b=buildBuffer(this.ctx,w);this.cache.set(key,b);
    if(this.cache.size>240)this.cache.delete(this.cache.keys().next().value);
    return b;
  }
};
function buildBuffer(ctx,w){
  const sr=ctx.sampleRate;
  if(w.type==='noise'){
    const step=Math.max(1,Math.round(sr/Math.max(200,w.hz)));
    let buf,a;
    if(w.metal){
      const steps=127;buf=ctx.createBuffer(1,steps*step,sr);a=buf.getChannelData(0);
      let lf=0x7f;
      for(let s=0;s<steps;s++){const bit=(lf^(lf>>1))&1;lf=(lf>>1)|(bit<<6);const v=(lf&1)?1:-1;for(let k=0;k<step;k++)a[s*step+k]=v;}
    }else{
      const n=Math.floor(sr/step)*step;buf=ctx.createBuffer(1,n,sr);a=buf.getChannelData(0);
      for(let s=0;s<n;s+=step){const v=Math.random()*2-1;for(let k=0;k<step&&s+k<n;k++)a[s+k]=v;}
    }
    return{buf,type:'noise'};
  }
  const W=w.data.length,D=w.d,val=v=>(v/(D-1))*2-1;
  if(w.type==='shot'){
    const n=Math.max(16,Math.round(w.shotMs/1000*sr));const buf=ctx.createBuffer(1,n,sr),a=buf.getChannelData(0);
    for(let i=0;i<n;i++){
      const p=i/n*W,i0=Math.min(W-1,Math.floor(p));
      if(!w.smooth)a[i]=val(w.data[i0]);
      else{const f=p-i0;const v0=val(w.data[i0]),v1=val(w.data[Math.min(W-1,i0+1)]);a[i]=v0+(v1-v0)*f;}
    }
    const fade=Math.min(n>>2,Math.round(sr*.004));for(let k=0;k<fade;k++)a[n-1-k]*=k/fade;
    return{buf,type:'shot'};
  }
  const K=Math.ceil(512/W),Ln=W*K;const buf=ctx.createBuffer(1,Ln,sr),a=buf.getChannelData(0);
  let mean=0;
  for(let i=0;i<Ln;i++){
    const p=i/K,i0=Math.floor(p);
    if(!w.smooth)a[i]=val(w.data[i0]);
    else{const f=p-i0;const v0=val(w.data[i0]),v1=val(w.data[(i0+1)%W]);a[i]=v0+(v1-v0)*f;}
    mean+=a[i];
  }
  mean/=Ln;for(let i=0;i<Ln;i++)a[i]-=mean;
  let peak=0;for(let i=0;i<Ln;i++)peak=Math.max(peak,Math.abs(a[i]));
  if(peak>0)for(let i=0;i<Ln;i++)a[i]/=peak;
  return{buf,type:'cycle'};
}
function adsrPts(e,dur,peak){
  const a=Math.max(e.a,.002),d=Math.max(e.d,.002),s=e.s*peak,r=Math.max(e.r,.006);
  const pts=[[0,0]];
  if(dur<=a)pts.push([dur,peak*dur/a]);
  else if(dur<=a+d){pts.push([a,peak]);pts.push([dur,peak+(s-peak)*((dur-a)/d)]);}
  else{pts.push([a,peak]);pts.push([a+d,s]);pts.push([dur,s]);}
  const last=pts[pts.length-1][1];
  pts.push([dur+r,0]);
  return{pts,end:dur+r,last};
}
function playVoice(sess,inst,freq,t0,dur){
  const ctx=sess.ctx;
  if(sess.src.size>180)return;
  const wa=Lib.wave(inst.waveA);if(!wa)return;
  const wb=inst.mode!=='single'?Lib.wave(inst.waveB):null;
  dur=Math.max(dur,.02);
  const amp=ctx.createGain();amp.gain.value=0;amp.connect(sess.bus);
  const env=adsrPts(inst.amp,dur,1),base=.28*inst.gain;
  amp.gain.setValueAtTime(0,t0);
  for(let k=1;k<env.pts.length;k++)amp.gain.linearRampToValueAtTime(env.pts[k][1]*base,t0+env.pts[k][0]);
  const end=t0+env.end+.03;
  function slot(w,ref,out){
    const b=Snd.buffer(w);const src=ctx.createBufferSource();src.buffer=b.buf;
    let rate;
    if(b.type==='cycle'){src.loop=true;rate=(inst.follow?freq:ref)*b.buf.length/ctx.sampleRate;}
    else if(b.type==='shot'){rate=inst.follow?freq/ref:1;}
    else{src.loop=true;rate=inst.follow?freq/261.63:1;}
    src.playbackRate.value=clamp(rate,.001,256);
    if(inst.pitch&&inst.pitch.cents){src.detune.setValueAtTime(inst.pitch.cents,t0);src.detune.setTargetAtTime(0,t0,Math.max(.002,inst.pitch.time/4));}
    src.connect(out);src.start(t0);src.stop(end);
    sess.src.add(src);
    src.onended=()=>{sess.src.delete(src);try{src.disconnect();}catch(e){}};
  }
  if(!wb){slot(wa,inst.refA,amp);}
  else if(inst.mode==='pair'){
    let mix=0;
    if(inst.follow&&inst.refA>0&&inst.refB>0&&inst.refA!==inst.refB)mix=clamp(Math.log2(freq/inst.refA)/Math.log2(inst.refB/inst.refA),0,1);
    if(mix<.99){const g=ctx.createGain();g.gain.value=1-mix;g.connect(amp);slot(wa,inst.refA,g);}
    if(mix>.01){const g=ctx.createGain();g.gain.value=mix;g.connect(amp);slot(wb,inst.refB,g);}
  }else{
    const m=inst.morph,me=adsrPts(m,dur,clamp(m.depth,0,1));
    const ga=ctx.createGain(),gb=ctx.createGain();ga.connect(amp);gb.connect(amp);
    ga.gain.setValueAtTime(1,t0);gb.gain.setValueAtTime(0,t0);
    for(let k=1;k<me.pts.length;k++){const tt=t0+Math.min(me.pts[k][0],env.end);ga.gain.linearRampToValueAtTime(1-me.pts[k][1],tt);gb.gain.linearRampToValueAtTime(me.pts[k][1],tt);}
    slot(wa,inst.refA,ga);slot(wb,inst.refB,gb);
  }
}
const Player={
  s:null,listeners:[],
  on(fn){this.listeners.push(fn);},
  emit(){for(const f of this.listeners)f(this.s?this.s.o.tag:null);},
  tag(){return this.s?this.s.o.tag:null;},
  start(o){
    this.stop(true);
    const ctx=Snd.ensure();
    const bus=ctx.createGain();bus.connect(Snd.master);
    const s={o,ctx,bus,idx:0,t0:ctx.currentTime+.12,src:new Set(),timer:null,total:o.total};
    this.s=s;
    s.timer=setInterval(()=>this.tick(),50);
    this.tick();this.emit();
  },
  tick(){
    const s=this.s;if(!s)return;
    const now=s.ctx.currentTime,horizon=now+.8,ev=s.o.events;
    while(s.idx<ev.length){
      const e=ev[s.idx],at=s.t0+e.t;
      if(at>horizon)break;
      const inst=s.o.resolve(e.inst);
      if(inst)playVoice(s,inst,e.freq,Math.max(at,now+.003),e.d);
      s.idx++;
    }
    if(s.idx>=ev.length){
      const end=s.t0+s.total;
      if(s.o.loop&&s.total>.1){if(now+.8>=end){s.t0=end;s.idx=0;}}
      else if(now>end+1.8)this.stop();
    }
  },
  position(){const s=this.s;if(!s)return null;return clamp(s.ctx.currentTime-s.t0,0,s.total);},
  stop(quiet){
    const s=this.s;if(!s)return;
    clearInterval(s.timer);this.s=null;
    try{s.bus.gain.cancelScheduledValues(s.ctx.currentTime);s.bus.gain.setTargetAtTime(0,s.ctx.currentTime,.012);}catch(e){}
    setTimeout(()=>{for(const x of s.src){try{x.stop();}catch(e){}}try{s.bus.disconnect();}catch(e){}},120);
    if(!quiet)this.emit();
  }
};

/* =====================  syntax highlighting  ===================== */
const TOK=/(\/\/.*$)|(\b(?:tuning|register|names|mode|tempo|root|motif|play|with|section|staff|length|rest|of)\b)|(\b(?:rev|inv|fit|loop|sets-length|x\d+)\b)|(\b[A-Za-z_][A-Za-z0-9_]*(?=\s*:(?!\s*[whqest][.*\d\/]*(?![A-Za-z0-9_]))))|(:[whqest][.*\d\/]*(?![A-Za-z0-9_]))|(\bn?\d+(?:\.\d+)?[#b]*(?:\^-?\d+)?)|([\[\]\(\)\{\}])/g;
function hi(line){
  let out='',last=0;TOK.lastIndex=0;let m;
  while((m=TOK.exec(line))){
    if(m.index>last)out+=esc(line.slice(last,m.index));
    const cls=m[1]?'com':m[2]?'kw':m[3]?'mod':m[4]?'inst':m[5]?'dur':m[6]?'num':'pun';
    out+='<span class="tk-'+cls+'">'+esc(m[0])+'</span>';last=m.index+m[0].length;
    if(m[0].length===0)TOK.lastIndex++;
  }
  return out+esc(line.slice(last));
}

/* =====================  compose  ===================== */
const Compose={
  last:null,prev:null,
  compileNow(src){return compile(src,{instruments:Lib.names(),defaultInst:Lib.defaultName()});},
  init(){
    this.ta=$('#code');this.hlIn=$('#hlIn');this.gut=$('#gutIn');
    const saved=store.get('motynth.code.v1');
    this.ta.value=saved!=null&&saved.trim()?saved:EXAMPLES[0].code;
    this.errLine=0;
    const redo=debounce(()=>this.live(),220);
    this.ta.addEventListener('input',()=>{this.render();redo();store.set('motynth.code.v1',this.ta.value);$('#restore').hidden=true;});
    this.ta.addEventListener('scroll',()=>this.sync());
    this.ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){
        e.preventDefault();const t=this.ta,a=t.selectionStart,b=t.selectionEnd;
        t.setRangeText('  ',a,b,'end');t.dispatchEvent(new Event('input'));
      }else if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();this.play(true);}
    });
    const sel=$('#examples');
    EXAMPLES.forEach((x,i)=>sel.append(h('option',{value:String(i)},x.name)));
    sel.addEventListener('change',()=>{
      if(sel.value==='')return;
      this.prev=this.ta.value;this.ta.value=EXAMPLES[+sel.value].code;sel.value='';
      this.render();this.live();store.set('motynth.code.v1',this.ta.value);$('#restore').hidden=false;
    });
    $('#restore').addEventListener('click',()=>{if(this.prev!=null){this.ta.value=this.prev;this.render();this.live();store.set('motynth.code.v1',this.ta.value);}$('#restore').hidden=true;});
    this.render();this.live();
  },
  render(){
    const lines=this.ta.value.split('\n');

/* piano roll */
let rollState=null;
function drawRoll(res){
  const cv=$('#roll'),box=cv.parentElement;
  const dpr=window.devicePixelRatio||1,W=box.clientWidth-4,H=box.clientHeight-4;
  if(W<=0||H<=0)return;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,W,H);
  rollState=res;
  const empty=$('#rollEmpty'),leg=$('#legend'),stats=$('#stats');
  if(!res||!res.events.length){
    empty.hidden=false;leg.replaceChildren();stats.replaceChildren();return;
  }
  empty.hidden=true;
  const pad=6,total=Math.max(res.total,.1);
  const pitched=[],unp=[];
  for(const e of res.events){const ins=Lib.inst(e.inst);((ins&&!ins.follow)||e.hit&&!(ins&&ins.follow)?unp:pitched).push(e);}
  const unpNames=[...new Set(unp.map(e=>e.inst))];
  const bandRow=Math.min(10,Math.max(5,Math.floor((H*.38)/Math.max(1,unpNames.length))));
  const bandH=unpNames.length?unpNames.length*bandRow+6:0;
  const topH=H-bandH-pad*2;
  const spw=240/res.bpm;
  g.fillStyle=cssv('--cell-grid');
  for(let t=0;t<total;t+=spw)g.fillRect(Math.round(pad+t/total*(W-pad*2)),0,1,H);
  if(bandH){g.fillRect(0,H-bandH-pad+2,W,1);}
  if(pitched.length){
    let lo=1e9,hi_=-1e9;for(const e of pitched){lo=Math.min(lo,e.n);hi_=Math.max(hi_,e.n);}
    const rows=hi_-lo+3;const rh=clamp(topH/rows,2,14);const used=rh*rows;const oy=pad+(topH-used)/2;
    for(const e of pitched){
      const x=pad+e.t/total*(W-pad*2),w=Math.max(2,e.d/total*(W-pad*2)-1);
      g.fillStyle=instColor(e.inst);
      g.fillRect(Math.round(x),Math.round(oy+(hi_-e.n+1)*rh),Math.round(w),Math.max(2,Math.floor(rh)-1));
    }
  }
  const by0=H-bandH-pad+5;
  for(const e of unp){
    const row=unpNames.indexOf(e.inst);
    const x=pad+e.t/total*(W-pad*2);
    g.fillStyle=instColor(e.inst);
    g.fillRect(Math.round(x),by0+row*bandRow,Math.max(2,Math.min(6,Math.round(e.d/total*(W-pad*2)))),Math.max(2,bandRow-2));
  }
  leg.replaceChildren(...res.used.map(n=>h('span',{},h('i',{style:'background:'+instColor(n)}),n)));
  stats.replaceChildren(h('span',{},'Length ',h('b',{},fmtTime(res.total))),h('span',{},'Notes ',h('b',{},res.count)),h('span',{},'Tempo ',h('b',{},Math.round(res.bpm*10)/10)));
}

function frame(){

    const box=$('#roll').parentElement,W=box.clientWidth-4,pad=6;

  }else ph.style.display='none';

  if(Player.s&&Snd.analyser){
    const data=new Uint8Array(Snd.analyser.fftSize);Snd.analyser.getByteTimeDomainData(data);
    g.fillStyle='#2ed3bf';

/* =====================  sounds: shared drawing  ===================== */
function drawThumb(cv,w){
  const g=cv.getContext('2d');
  const W=w.type==='noise'?24:w.data.length,H=10;
  cv.width=W;cv.height=H;
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,W,H);
  g.fillStyle=cssv('--cell-on');
  if(w.type==='noise'){
    let s=w.id.length*7+(w.metal?3:1);
    for(let i=0;i<W;i++){s=(s*1103515245+12345)&0x7fffffff;const v=Math.floor((s/0x7fffffff)*(H-2));g.fillRect(i,v,1,2);}
    return;
  }
  for(let i=0;i<W;i++){const v=Math.round((1-w.data[i]/(w.d-1))*(H-2));g.fillRect(i,v,1,2);}
}
function drawEnv(cv,e){
  const g=cv.getContext('2d'),W=56,H=14;cv.width=W;cv.height=H;
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,W,H);
  const hold=Math.max(.12,(e.a+e.d)*.6),T=e.a+e.d+hold+e.r;
  const fill=cssv('--cell-fill'),on=cssv('--cell-on');
  for(let x=0;x<W;x++){
    const t=(x+.5)/W*T;let v;
    if(t<e.a)v=e.a>0?t/e.a:1;
    else if(t<e.a+e.d)v=1+(e.s-1)*((t-e.a)/Math.max(e.d,1e-6));
    else if(t<e.a+e.d+hold)v=e.s;
    else v=e.s*(1-(t-e.a-e.d-hold)/Math.max(e.r,1e-6));
    v=clamp(v,0,1);const hh=Math.round(v*(H-2));
    g.fillStyle=fill;g.fillRect(x,H-hh,1,hh);g.fillStyle=on;g.fillRect(x,H-hh-1,1,1);
  }
  g.fillStyle=cssv('--cell-grid');
  g.fillRect(Math.round((e.a+e.d)/T*W),0,1,H);g.fillRect(Math.round((e.a+e.d+hold)/T*W),0,1,H);
}
function drawWave(cv,w){
  const W=w.data.length,D=w.d,cw=Math.floor(448/W),ch=Math.floor(224/D);
  cv.width=W*cw;cv.height=D*ch;
  const g=cv.getContext('2d');
  g.fillStyle=cssv('--cell-bg');g.fillRect(0,0,cv.width,cv.height);
  const fill=cssv('--cell-fill'),on=cssv('--cell-on'),grid=cssv('--cell-grid'),zero=cssv('--cell-zero');
  const mid=D/2;
  for(let i=0;i<W;i++){
    const row=D-1-w.data[i];
    g.fillStyle=fill;
    if(row<mid)g.fillRect(i*cw,row*ch,cw,(mid-row)*ch);
    else g.fillRect(i*cw,mid*ch,cw,(row-mid+1)*ch);
  }
  g.fillStyle=grid;
  for(let i=1;i<W;i++)g.fillRect(i*cw,0,1,cv.height);
  for(let j=1;j<D;j++)g.fillRect(0,j*ch,cv.width,1);
  g.fillStyle=zero;g.fillRect(0,mid*ch-1,cv.width,2);
  g.fillStyle=on;
  for(let i=0;i<W;i++){const row=D-1-w.data[i];g.fillRect(i*cw+1,row*ch+1,cw-1,ch-1);}
  if(w.smooth){
    g.strokeStyle=zero;g.lineWidth=2;g.beginPath();
    for(let i=0;i<W;i++){const x=i*cw+cw/2,y=(D-1-w.data[i])*ch+ch/2;i?g.lineTo(x,y):g.moveTo(x,y);}
    g.stroke();
  }
}

    h('select',{'aria-label':'Width in pixels',onchange:e=>{const nW=+e.target.value;w.data=resampleData(w.data,w.data.length,w.d,nW,w.d);change();renderWaveEditor();lists();}},[8,16,32,64].map(n=>h('option',{value:n,selected:w.data.length===n},n+' px'))),
    h('span',{class:'rowl'},'Levels'),
    h('select',{'aria-label':'Number of levels',onchange:e=>{const nD=+e.target.value;w.data=resampleData(w.data,w.data.length,w.d,w.data.length,nD);w.d=nD;change();renderWaveEditor();lists();}},[2,4,8,16].map(n=>h('option',{value:n,selected:w.d===n},n)))));
  host.append(h('label',{class:'field'},h('input',{type:'checkbox',checked:w.smooth,onchange:e=>{w.smooth=e.target.checked;redraw();change();}}),h('span',{},'Smooth the steps (off keeps the crunch)')));
  if(w.type==='shot')host.append(slider('Length',10,600,5,w.shotMs,v=>Math.round(v)+' ms',v=>{w.shotMs=v;change();}),h('p',{class:'hint'},'Plays once through the grid at the instrument\u2019s reference pitch, and is sped up or slowed down to follow other notes.'));
  else host.append(h('p',{class:'hint'},'One cycle of the wave. It repeats at the pitch of each note.'));
  const apply=(fn)=>()=>{fn();redraw();change();lists();renderInstEditor();};
  const gen=k=>apply(()=>{w.data=shape(k,w.data.length,w.d,k==='pulse'?.25:undefined);});
  host.append(h('div',{class:'row'},h('span',{class:'rowl'},'Start from'),
    ...[['sine','Sine'],['tri','Triangle'],['saw','Saw'],['pulse','Pulse'],['organ','Organ'],['random','Random']].map(([k,l])=>h('button',{class:'btn small',onclick:gen(k)},l))));
  host.append(h('div',{class:'row'},h('span',{class:'rowl'},'Edit'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data=w.data.map(v=>w.d-1-v);})},'Flip'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data=w.data.slice().reverse();})},'Mirror'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data.unshift(w.data.pop());})},'Shift right'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data.push(w.data.shift());})},'Shift left'),
    h('button',{class:'btn small',onclick:apply(()=>{w.data=w.data.map(()=>Math.floor(w.d/2));})},'Clear'),
    h('button',{class:'btn small danger',disabled:Lib.waves.length<2,onclick:()=>{
      const id=w.id;const other=Lib.waves.find(x=>x.id!==id);
      for(const i of Lib.insts){if(i.waveA===id)i.waveA=other.id;if(i.waveB===id)i.waveB=other.id;}
      Lib.waves=Lib.waves.filter(x=>x.id!==id);Lib.selWave=other.id;Lib.save();renderSounds();
    }},'Delete wave')));
  host.append(h('ul',{class:'tiplist'},h('li',{},'Click and drag on the grid to set each column.'),h('li',{},'The pink line is silence; a wave that sits above or below it is re-centered automatically.')));
}

/* =====================  learn  ===================== */
const Learn={
  idx:0,
  init(){this.render();},
  render(){
    const nav=$('#lessonNav');nav.replaceChildren(h('h2',{style:'margin-bottom:10px;font-size:18px'},'Lessons'),
      ...LESSONS.map((l,i)=>h('button',{'aria-current':i===this.idx?'true':'false',onclick:()=>{this.idx=i;this.render();window.scrollTo({top:0});}},l.title)));
    const art=$('#lesson');art.replaceChildren();
    const L=LESSONS[this.idx];
    art.append(h('h2',{},L.title));
    if(L.ref){
      art.append(h('p',{},'Everything the language understands, in one place.'));
      for(const [grp,rows] of REFERENCE)art.append(h('h3',{},grp),h('table',{class:'reftbl'},h('tbody',{},rows.map(r=>h('tr',{},h('td',{},r[0]),h('td',{},r[1]))))));
    }
    L.blocks.forEach((b,k)=>{
      if(b.p)art.append(h('p',{},b.p));
      else if(b.code)art.append(this.snippet(b.code,L.id+'-'+k));
    });
    art.append(h('div',{class:'pager'},
      this.idx>0?h('button',{class:'btn',onclick:()=>{this.idx--;this.render();window.scrollTo({top:0});}},'Previous: '+LESSONS[this.idx-1].title):h('span'),
      this.idx<LESSONS.length-1?h('button',{class:'btn',onclick:()=>{this.idx++;this.render();window.scrollTo({top:0});}},'Next: '+LESSONS[this.idx+1].title):h('span')));
    refreshTransport();
  },
  snippet(code,id){
    const msg=h('span',{class:'snip-msg',role:'alert'});
    const play=h('button',{class:'btn small','data-snip':id,onclick:()=>{
      if(Player.tag()===id){Player.stop();return;}
      msg.textContent='';
      const res=compile(code,{instruments:Lib.names(),defaultInst:Lib.defaultName()});
      if(!res.ok){msg.textContent='Line '+res.error.line+': '+res.error.msg;return;}
      Snd.ensure();
      Player.start({tag:id,events:res.events,total:res.total,loop:false,resolve:n=>Lib.inst(n)});
    }});
    const open=h('button',{class:'btn small',onclick:()=>{Compose.ta.value=code;store.set('motynth.code.v1',code);Compose.render();showTab('compose');Compose.live();}},'Open in Compose');
    return h('div',{class:'snip'},h('pre',{html:code.split('\n').map(hi).join('\n')}),h('div',{class:'snip-bar'},play,open,msg));
  }
};

/* =====================  tabs & boot  ===================== */
function showTab(name){
  for(const t of ['compose','sounds','learn']){
    $('#view-'+t).hidden=t!==name;
    $('#tab-'+t).setAttribute('aria-selected',t===name?'true':'false');
  }
  if(name==='compose'){Compose.render();Compose.live();}
  if(name==='sounds')renderSounds();
  store.set('motynth.tab',name);
}
function buildLogo(){
  const cols=[2,3,5,6,5,3,1,2,4,5],cols2=['#7d90ff','#ff6fa3','#ffc04a','#2ed3bf','#a98cff'];
  const S=5,G=1,svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+cols.length*(S+G)+' '+6*(S+G));svg.setAttribute('width',cols.length*(S+G)*.9);svg.setAttribute('height',6*(S+G)*.9);svg.setAttribute('aria-hidden','true');
  cols.forEach((n,i)=>{for(let k=0;k<n;k++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',i*(S+G));r.setAttribute('y',(5-k)*(S+G));r.setAttribute('width',S);r.setAttribute('height',S);r.setAttribute('fill',cols2[(i+k)%5]);svg.append(r);}});
  $('#logo').replaceChildren(svg);
}
function boot(){
  Lib.load();
  buildLogo();
  Compose.init();Test.init();Learn.init();
  Player.on(refreshTransport);
  $('#playbtn').addEventListener('click',()=>{Snd.ensure();Compose.play();});
  ['compose','sounds','learn'].forEach(t=>$('#tab-'+t).addEventListener('click',()=>showTab(t)));
  $('#testMotif').value=TESTS[0][1];
  refreshTransport();
  const t=store.get('motynth.tab');showTab(['compose','sounds','learn'].includes(t)?t:'compose');
  window.addEventListener('resize',debounce(()=>{if(!$('#view-compose').hidden)drawRoll(Compose.last&&Compose.last.ok?Compose.last:null);},150));
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>showTab(store.get('motynth.tab')||'compose'));
  requestAnimationFrame(frame);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&Player.s)Player.stop();});

boot();
</script>
